name: Migrate

# Al mergear a feedback / staging / main, sube las migraciones nuevas
# al proyecto de Supabase de esa rama.
# Cada rama es un GitHub Environment con sus propios secrets.
on:
  push:
    branches: [feedback, staging, main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: migrate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟩 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.58.5

      - name: 🔗 Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: 👀 Preview (dry run)
        run: supabase db push --dry-run

      - name: 🚀 Push migrations
        run: supabase db push
