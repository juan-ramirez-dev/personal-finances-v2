name: Validate Supabase migrations (local)

on:
  pull_request:
    branches:
      - feedback
      - main
      - staging
    paths:
      - 'supabase/migrations/**'

jobs:
  validate-migrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start local Supabase DB
        run: |
          npx supabase@latest db start

      - name: Apply migrations on local DB
        run: |
          npx supabase@latest db reset --local --no-seed --yes
